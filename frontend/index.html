<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmaAvaruus</title>
  <meta name="description" content="Avaruussää, revontuliennuste, taivaankartta ja rakettilaukaisut." />
  <meta name="theme-color" content="#05070f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>OmaAvaruus</h1>
    <p class="sub">Avaruussää · taivaankartta · laukaisut</p>
    <div id="clock" class="clock"></div>
    <div id="offline" class="offline" role="status" hidden></div>
    <div class="place">
      <span id="place-name" class="place-name"></span>
      <button type="button" id="place-toggle" class="link-btn" aria-expanded="false" aria-controls="place-panel">Vaihda paikka</button>
      <div id="place-panel" class="place-panel" hidden>
        <ul id="place-list" class="place-list"></ul>
        <form id="place-search" class="place-search">
          <input type="search" id="place-query" placeholder="Kirjoita paikan nimi, esim. Rovaniemi" autocomplete="off" aria-label="Hae paikkaa nimellä" minlength="2" maxlength="80" required />
          <button type="submit">Hae</button>
        </form>
        <div id="place-status" class="muted" role="status"></div>
        <ul id="place-results" class="place-list"></ul>
      </div>
    </div>
  </header>

  <main>
    <section class="card" id="weather">
      <h2>Avaruussää</h2>
      <div class="kp-row info-host">
        <div class="kp-badge"><span id="kp">–</span><small data-info-slot="kp">Kp nyt</small></div>
        <div>
          <div id="g-label" class="g-label">Ladataan…</div>
          <div id="aurora" class="aurora">Revontulimahdollisuus: –</div>
        </div>
      </div>
      <div id="clouds" class="muted"></div>
      <div id="wind" class="muted"></div>
      <div id="hourly" class="hourly" hidden>
        <h3 class="info-host" data-info-slot="hourly">Seuraavat 24 h</h3>
        <div id="best-window" class="best-window"></div>
        <div id="hours" class="hours"></div>
        <div id="hour-detail" class="muted"></div>
      </div>
      <div class="push">
        <h3 class="info-host" data-info-slot="push">Revontuli-ilmoitukset</h3>
        <div id="push-status" class="muted" role="status"></div>
        <div id="push-controls" class="push-controls" hidden>
          <label>Ilmoita, kun arvio on vähintään
            <select id="push-threshold">
              <option>Mahdollinen</option>
              <option selected>Hyvä</option>
              <option>Erittäin hyvä</option>
            </select>
          </label>
          <button type="button" id="push-enable">Ota ilmoitukset käyttöön</button>
          <button type="button" id="push-move" hidden></button>
          <button type="button" id="push-test" hidden>Lähetä testi-ilmoitus</button>
          <button type="button" id="push-disable" hidden>Poista käytöstä</button>
        </div>
      </div>
      <svg id="kp-chart" viewBox="0 0 320 110" role="img" aria-label="Kp-indeksin kehitys"></svg>
      <ul id="alerts" class="alerts"></ul>
    </section>

    <section class="card" id="sky">
      <h2 class="info-host" data-info-slot="sky">Taivaankartta</h2>
      <div class="sky-controls">
        <label>Aika <input type="range" id="time-offset" min="-720" max="720" step="10" value="0" /></label>
        <span id="time-label" class="muted"></span>
      </div>
      <svg id="sky-chart" viewBox="0 0 400 420" role="img" aria-label="Taivaankartta"></svg>
      <div id="sky-detail" class="sky-detail" aria-live="polite" hidden></div>
      <div id="sky-meta" class="muted"></div>
      <div id="object-list" class="objects"></div>
    </section>

    <section class="card" id="launches">
      <h2 class="info-host" data-info-slot="launch">Laukaisut <span class="live">PÄIVITTYVÄ</span></h2>
      <div id="next-launch" class="next-launch">Ladataan…</div>
      <ol id="launch-list" class="launch-list"></ol>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
